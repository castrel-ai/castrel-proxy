name: Build PyInstaller Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.3)'
        required: false
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: castrel-proxy-linux-x86_64
            binary_name: castrel-proxy
          - os: macos-latest
            artifact_name: castrel-proxy-macos-x86_64
            binary_name: castrel-proxy
          - os: windows-latest
            artifact_name: castrel-proxy-windows-x86_64
            binary_name: castrel-proxy.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Install PyInstaller
        run: |
          uv pip install pyinstaller

      - name: Create entry script (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cat > entry_point.py << 'EOF'
          #!/usr/bin/env python
          """Entry point for PyInstaller - uses absolute imports"""
          from castrel_proxy.cli.commands import run
          if __name__ == "__main__":
              run()
          EOF

      - name: Create entry script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -c "with open('entry_point.py', 'w', encoding='utf-8') as f: f.write('''#!/usr/bin/env python\n\"\"\"Entry point for PyInstaller - uses absolute imports\"\"\"\nfrom castrel_proxy.cli.commands import run\nif __name__ == \"__main__\":\n    run()\n''')"

      - name: Build with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller \
            --onefile \
            --name ${{ matrix.binary_name }} \
            --paths src \
            --hidden-import castrel_proxy.data \
            --hidden-import castrel_proxy.cli.commands \
            --hidden-import typer \
            --hidden-import aiohttp \
            --hidden-import mcp \
            --hidden-import langchain_mcp_adapters \
            --hidden-import file_read_backwards \
            --console \
            --collect-all castrel_proxy \
            entry_point.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          uv run pyinstaller --onefile --name ${{ matrix.binary_name }} --paths src --hidden-import castrel_proxy.data --hidden-import castrel_proxy.cli.commands --hidden-import typer --hidden-import aiohttp --hidden-import mcp --hidden-import langchain_mcp_adapters --hidden-import file_read_backwards --console --collect-all castrel_proxy entry_point.py

      - name: Test binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./dist/${{ matrix.binary_name }}
          ./dist/${{ matrix.binary_name }} --help

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          dist\${{ matrix.binary_name }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
          retention-days: 30

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create checksums and prepare release
        shell: bash
        run: |
          cd dist
          mkdir -p release
          
          # Process each artifact directory
          for artifact_dir in castrel-proxy-*/; do
            if [ -d "$artifact_dir" ]; then
              # Get platform name from directory
              platform_name=$(basename "$artifact_dir")
              
              # Find binary file
              binary_file=$(find "$artifact_dir" -type f \( -name "castrel-proxy" -o -name "castrel-proxy.exe" \) | head -1)
              
              if [ -n "$binary_file" ] && [ -f "$binary_file" ]; then
                # Determine output filename (add .exe for Windows)
                if [[ "$platform_name" == *"windows"* ]]; then
                  output_name="${platform_name}.exe"
                else
                  output_name="${platform_name}"
                fi
                
                # Create checksum
                shasum -a 256 "$binary_file" > "${binary_file}.sha256"
                
                # Copy to release directory
                cp "$binary_file" "release/${output_name}"
                cp "${binary_file}.sha256" "release/${output_name}.sha256"
              fi
            fi
          done
          
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Castrel Proxy ${{ steps.get_version.outputs.version }}

            ### Downloads

            - **Linux**: `castrel-proxy-linux-x86_64`
            - **macOS**: `castrel-proxy-macos-x86_64`
            - **Windows**: `castrel-proxy-windows-x86_64.exe`

            ### Installation

            **macOS/Linux:**
            ```bash
            # Download the binary
            # Add execute permission (if needed)
            chmod +x castrel-proxy-macos-x86_64  # or castrel-proxy-linux-x86_64
            
            # Option 1: Run directly from current directory
            ./castrel-proxy-macos-x86_64 start
            
            # Option 2: Move to a directory in your PATH (recommended)
            sudo mv castrel-proxy-macos-x86_64 /usr/local/bin/castrel-proxy
            castrel-proxy start
            ```

            **Windows:**
            ```cmd
            # Download the .exe file
            # Run directly
            castrel-proxy-windows-x86_64.exe start
            ```

            ### Checksums

            SHA256 checksums are included for each binary.

            ---

            Full changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          files: |
            dist/release/*
          draft: false
          prerelease: false
